kind = "web"
previewPath = "/"
title = "Auditor Pro Web"
version = "1.0.0"
id = "artifacts/auditor-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21137

[services.development]
run = "pnpm --filter @workspace/auditor-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auditor-pro", "run", "build" ]
publicDir = "artifacts/auditor-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21137"
BASE_PATH = "/"
